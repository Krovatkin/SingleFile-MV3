name: Sync from upstream

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # GITHUB_TOKEN can't push upstream's workflow files; SYNC_TOKEN needs the workflow scope
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/gildas-lormeau/SingleFile-MV3.git
          git fetch upstream main

      - name: Check if upstream has new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream (accept theirs for lib/)
        id: merge
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          if ! git merge upstream/main --no-edit; then
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            NON_LIB=$(echo "$CONFLICTED" | grep -v '^lib/' || true)
            if [ -n "$NON_LIB" ]; then
              echo "error_msg=Merge conflicts in source files: $NON_LIB" >> "$GITHUB_OUTPUT"
              git merge --abort
              exit 1
            fi
            git checkout upstream/main -- lib/
            git add lib/
            git commit --no-edit
          fi

      # Same Node version as upstream's CI, so its "committed build output" check sees identical bundles
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Lint, test and build
        run: |
          npm ci
          npx eslint .
          npm run test:unit
          ./build.sh

      # lib/ must be rebuilt from our src/, otherwise the committed bundles lose the pCloud code
      - name: Commit rebuilt lib/
        id: rebuild
        run: |
          if git diff --quiet -- lib/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add lib/
            git commit -m "Rebuild lib/ with pCloud changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.check.outputs.up_to_date == 'false' || steps.rebuild.outputs.changed == 'true'
        run: git push origin main

      - name: Notify Telegram (success)
        if: success() && (steps.check.outputs.up_to_date == 'false' || steps.rebuild.outputs.changed == 'true')
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *SingleFile-MV3 sync succeeded*%0AMerged upstream and verified build."

      - name: Notify Telegram (already up to date)
        if: success() && steps.check.outputs.up_to_date == 'true' && steps.rebuild.outputs.changed == 'false'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="ℹ️ SingleFile-MV3: already up to date with upstream, nothing to do."

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *SingleFile-MV3 sync FAILED*%0A%0ACheck logs: https://github.com/Krovatkin/SingleFile-MV3/actions%0A%0APossible causes:%0A• Merge conflict in source files (needs manual fix)%0A• Lint, tests or build failed (upstream broke compatibility with pCloud code)%0A• Push rejected (check the SYNC_TOKEN secret)"
